# /etc/nginx/sites-available/gate-pass — the plain-HTTP version.
#
# __APP_DIR__ is substituted when this is installed (deploy/disable-https.sh).
# deploy/nginx-gate-pass-ssl.conf is the TLS version; enable-https.sh swaps
# this for that.
#
# nginx terminates the connection, serves the static files, and passes
# everything else to gunicorn on 127.0.0.1:8090.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # Catch-all: this answers on the LAN IP, on <hostname>.local, and on the
    # Tailscale address without being edited for each.
    server_name _;

    # Must be at least as large as MAX_CONTENT_LENGTH in app.py (32MB), or nginx
    # rejects a big scanned invoice with its own 413 before Flask ever sees it
    # and can show a useful message. The batch uploader sends one file per
    # request, so this is a per-invoice limit, not a per-batch one.
    client_max_body_size 32M;

    # A whole-year Excel export can take ~20s to build. These must exceed the
    # gunicorn timeout or nginx gives up first and shows 504 on a download that
    # was going to succeed.
    proxy_connect_timeout 10s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    access_log /var/log/nginx/gate-pass.access.log;
    error_log  /var/log/nginx/gate-pass.error.log;

    # The CA certificate, so a machine can fetch the thing that makes HTTPS
    # trustworthy. Served here as well as on the TLS site, because this is the
    # site running when HTTPS is off — which is precisely when it is needed.
    location = /fanzart-ca.pem {
        alias __CERT_DIR__/fanzart-ca.pem;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="fanzart-ca.pem"';
    }

    # Logo, CSS and print stylesheet — served by nginx, never touching Python.
    location /static/ {
        alias __APP_DIR__/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        # Host must be passed through: the app compares the Origin header of
        # every POST against it to block cross-site writes, and a rewritten
        # Host would make every form submission look forged.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An export is streamed row by row; buffering would hold the whole file
        # in nginx before the download starts.
        proxy_buffering off;
    }
}

# --- Once there is a certificate -------------------------------------------
# Serve the block above on 443 with ssl_certificate/ssl_certificate_key, make
# the port 80 block `return 301 https://$host$request_uri;`, and set
# GATE_PASS_HTTPS=1 in the systemd unit so the session cookie becomes
# HTTPS-only. Do not set that variable before the certificate is live.
