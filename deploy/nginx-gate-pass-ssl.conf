# /etc/nginx/sites-available/gate-pass  — the HTTPS version.
#
# Installed by deploy/enable-https.sh, which substitutes the paths. Do not edit
# the copy under /etc/nginx by hand: the next install run overwrites it.
#
# Certificates come from deploy/make-cert.sh — a local CA plus a server cert.
# There is no public authority that will vouch for `fanzart-server.local`, so
# the CA has to be installed once on each office machine for the padlock to be
# clean. Until then browsers warn; the traffic is encrypted regardless.

# Port 80 exists only to send people to port 443.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 301, not the 311 in the original note — 311 is not an HTTP status code and
    # browsers treat an unknown 3xx as an error rather than a redirect.
    # Permanent, because this address is not coming back.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     __CERT_DIR__/server.pem;
    ssl_certificate_key __CERT_DIR__/server.key;

    # TLS 1.2 and 1.3 only. Everything older is broken, and nothing in the
    # office is old enough to need it.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # No HSTS. It would be the correct header on a public site, but here it
    # pins every browser to HTTPS for this hostname for months — including
    # after a certificate expires or the machine is rebuilt, with no way for a
    # user to click past it. On a LAN that is a lockout waiting to happen.

    # Must be at least MAX_CONTENT_LENGTH in app.py (32MB) or nginx rejects a
    # large scanned invoice with its own 413 before Flask can explain why.
    client_max_body_size 32M;

    # A whole-year Excel export takes ~20s to build; these must outlast the
    # gunicorn timeout or nginx gives up on a download that would have worked.
    proxy_connect_timeout 10s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    access_log /var/log/nginx/gate-pass.access.log;
    error_log  /var/log/nginx/gate-pass.error.log;

    location /static/ {
        alias __APP_DIR__/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        # Host must pass through untouched: every POST is checked for a
        # same-origin Origin header against it, so a rewritten Host makes every
        # form submission look forged and returns 403.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Tells the app the browser is on HTTPS even though this hop is plain
        # HTTP to localhost. Hard-coded rather than $scheme because this block
        # only ever serves TLS.
        proxy_set_header X-Forwarded-Proto https;

        # An export is streamed row by row; buffering would hold the whole file
        # in nginx before the download starts.
        proxy_buffering off;
    }
}
