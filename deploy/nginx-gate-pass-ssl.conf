# /etc/nginx/sites-available/gate-pass  — the HTTPS version.
#
# Installed by deploy/enable-https.sh, which substitutes the paths and the
# addresses. Do not edit the copy under /etc/nginx by hand: the next run
# overwrites it.
#
# ---------------------------------------------------------------------------
# Why 443 is bound to named addresses instead of every address
#
# `listen 443 ssl;` means 0.0.0.0:443, and on this machine that bind FAILS:
#
#     bind() to 0.0.0.0:443 failed (98: Address already in use)
#
# because tailscaled is already listening on 443 on the Tailscale addresses to
# serve Funnel. nginx then refuses the whole config and keeps running the
# previous one — so the site carries on working over plain HTTP and nothing
# looks wrong until somebody checks. That is exactly how this failed the first
# time.
#
# So the listen lines in the TLS block below are a list of the addresses nginx
# may actually have, filled in at install time from a placeholder. It contains
# the LAN address and 127.0.0.1, and deliberately NOT the Tailscale ones.
#
# That placeholder is NOT named anywhere in these comments on purpose: the
# substitution is a plain string replace, so a mention in prose gets replaced
# too and drops a bare `listen` outside any server block. nginx then says
# "listen directive is not allowed here" and refuses the whole file.
#
# The consequence: over Tailscale the site stays on plain HTTP. That is not a
# downgrade — WireGuard has already encrypted the whole connection before nginx
# sees it — but it does mean the port 80 block below must not blindly redirect
# to a port nginx does not answer on. Hence the map.
# ---------------------------------------------------------------------------

# 1 = send this request to HTTPS, 0 = serve it here.
# Keyed on the address the request ARRIVED on, not on the Host header, because
# the Host can be anything and the address is what decides whether nginx has a
# TLS listener for it.
map $server_addr $needs_https {
    default    1;
    "~^100\."  0;   # Tailscale CGNAT — tailscaled owns 443 there
    "~^fd7a:"  0;   # Tailscale IPv6
    "127.0.0.1" 1;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 32M;

    # 301, not the 311 originally specified — 311 is not an HTTP status code,
    # and browsers treat an unknown 3xx as an error rather than a redirect.
    if ($needs_https) {
        return 301 https://$host$request_uri;
    }

    # Reached only over Tailscale, where 443 is not ours to answer on.
    access_log /var/log/nginx/gate-pass.access.log;
    error_log  /var/log/nginx/gate-pass.error.log;

    location /static/ {
        alias __APP_DIR__/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # http, truthfully: this hop is not TLS. Saying https here would make
        # the app set a Secure session cookie that the browser then refuses to
        # send back over this connection, and nobody could stay signed in.
        proxy_set_header X-Forwarded-Proto http;
        proxy_buffering off;
    }
}

server {
    # Substituted at install time — see the note at the top.
__HTTPS_LISTEN__
    http2 on;
    server_name _;

    ssl_certificate     __CERT_DIR__/server.pem;
    ssl_certificate_key __CERT_DIR__/server.key;

    # TLS 1.2 and 1.3 only. Everything older is broken and nothing in the
    # office is old enough to need it.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # No HSTS. It is the right header on a public site, but here it pins every
    # browser to HTTPS for this hostname for months — including after a
    # certificate expires or the machine is rebuilt, with no way for a user to
    # click past it. On a LAN that is a lockout waiting to happen.

    # Must be at least MAX_CONTENT_LENGTH in app.py (32MB), or nginx rejects a
    # large scanned invoice with its own 413 before Flask can explain why.
    client_max_body_size 32M;

    # A whole-year Excel export takes ~20s to build; these must outlast the
    # gunicorn timeout or nginx gives up on a download that would have worked.
    proxy_connect_timeout 10s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    access_log /var/log/nginx/gate-pass.access.log;
    error_log  /var/log/nginx/gate-pass.error.log;

    location /static/ {
        alias __APP_DIR__/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        # Host must pass through untouched: every POST is checked for a
        # same-origin Origin header against it, so a rewritten Host makes every
        # form submission look forged and returns 403.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # An export is streamed row by row; buffering would hold the whole file
        # in nginx before the download starts.
        proxy_buffering off;
    }
}
