# One office-path server per extra port the public name carries (FanIQ on
# 8443, MailStream on 10000, ...) — rendered once per port by
# enable-office-link.sh from `tailscale serve status --json`, Funnel ports
# only, into /etc/nginx/sites-available/zz-gate-pass-office-link.
#
# Why a separate site, and why "zz-": nginx gives a socket's unnamed traffic
# to the FIRST server defined on it, and sites load in name order. MailStream
# already serves https://192.168.1.45:10000 with the office certificate; this
# file sorting after it keeps that the default, and only requests that ask for
# the public name by SNI land here.
server {
    listen __LAN_IP__:__PORT__ ssl;
    server_name __TAILNET_NAME__;

    ssl_certificate     __TAILNET_TLS_DIR__/__TAILNET_NAME__.crt;
    ssl_certificate_key __TAILNET_TLS_DIR__/__TAILNET_NAME__.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 64M;
    proxy_connect_timeout 10s;
    proxy_send_timeout    190s;
    proxy_read_timeout    190s;

    access_log /var/log/nginx/gate-pass-office-link.access.log;
    error_log  /var/log/nginx/gate-pass-office-link.error.log;

    location / {
        # Straight to what Funnel proxies this port to, with what Funnel
        # sends: the Host as typed (port included), the client, and https.
        proxy_pass __TARGET__;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $gp_office_upgrade;
        proxy_buffering off;
    }
}
