# ---------------------------------------------------------------------------
# The public link's name, answered from inside the office.
#
# Appended to the gate-pass site by enable-https.sh, and only once
# enable-office-link.sh has fetched a certificate for the name — so a server
# that never ran that script gets exactly the site it always had.
#
# WHY IT EXISTS
# The public link travels office -> internet -> Tailscale's Funnel relay ->
# back down the same internet line -> this server. Every office machine without
# Tailscale therefore depends on the office ISP reaching that relay, and on
# 17-10-2026 it stopped: the link worked from everywhere else in the world and
# timed out (ERR_TIMED_OUT) on every PC in the building. Nothing on this server
# was wrong, and nothing here could repair the ISP's route.
#
# So an office machine that is told the name lives at the server's LAN address
# (router DNS, or the hosts entry fix-name-windows.ps1 writes) comes straight
# here instead, and never leaves the building. It gets the same genuine
# Let's Encrypt certificate the relay shows, so the padlock is clean with
# nothing installed, and the same page the relay would have given it.
#
# It hands over to the Funnel's own front door, 127.0.0.1:8091, rather than
# to the app, so this is not a second copy of the site that could drift from
# the public one: it IS the public one, minus the trip abroad.
# ---------------------------------------------------------------------------
server {
__HTTPS_LISTEN__
    http2 on;
    server_name __TAILNET_NAME__;

    # Fetched and renewed by enable-office-link.sh (tailscale cert), daily.
    ssl_certificate     __TAILNET_TLS_DIR__/__TAILNET_NAME__.crt;
    ssl_certificate_key __TAILNET_TLS_DIR__/__TAILNET_NAME__.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # The front door below checks the body size too; this one has to let the
    # same 32MB through first, or a scanned invoice dies here with nginx's 413.
    client_max_body_size 32M;
    keepalive_timeout 65;
    keepalive_requests 200;
    proxy_connect_timeout 10s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    access_log /var/log/nginx/gate-pass.access.log;
    error_log  /var/log/nginx/gate-pass.error.log;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;

        # Exactly what tailscaled sends the front door: the name the browser
        # typed (so the same-origin check on every POST lines up), the real
        # client address, and that the browser's hop was TLS.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
}
